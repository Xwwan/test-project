# Copy this file to config/app.local.yaml for local-only overrides.
# config/app.local.yaml is ignored by git.
#
# Keep real API keys in .env. This file should only name the environment
# variables that contain those keys.

providers:
  yunwu:
    type: openai-compatible
    base_url: https://yunwu.ai/v1
    api_key_env: YUNWU_API_KEY
    timeout_seconds: 60

routes:
  default:
    default:
      provider: yunwu
      model: gpt-5.5

  dialogue:
    initial:
      provider: yunwu
      model: gpt-5.5
      temperature: 0.7

    followup:
      provider: yunwu
      model: gpt-5.5
      temperature: 0.0
      response_format:
        type: json_object

dialogue:
  followup:
    # Number of latest/newer conversation turns sent to the follow-up decision prompt.
    # Use -1 to include all available context.
    context_window_turns: 50
