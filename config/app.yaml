providers:
  openai_default:
    type: openai
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    timeout_seconds: 60

  anthropic_default:
    type: anthropic
    base_url: https://api.anthropic.com
    api_key_env: ANTHROPIC_API_KEY
    anthropic_version: "2023-06-01"
    timeout_seconds: 60

  local_openai_compatible:
    type: openai-compatible
    base_url: http://localhost:12345/v1
    api_key_env: OPENAI_API_KEY
    api_key_fallback: not-needed
    timeout_seconds: 60

  yunwu:
    type: openai-compatible
    base_url: https://yunwu.ai/v1
    api_key_env: YUNWU_API_KEY
    timeout_seconds: 60

routes:
  default:
    default:
      provider: yunwu
      model: deepseek-v4-flash

  dialogue:
    initial:
      provider: yunwu
      model: deepseek-v4-flash
      temperature: 0.7

    followup:
      provider: yunwu
      model: deepseek-v4-flash
      temperature: 0.0
      response_format:
        type: json_object

  memory:
    retrieval:
      provider: yunwu
      model: deepseek-v4-flash
      temperature: 0.0
      response_format:
        type: json_object

    curator:
      provider: yunwu
      model: deepseek-v4-flash
      temperature: 0.0
      response_format:
        type: json_object

dialogue:
  retrieval:
    # Maximum concurrent background memory retrieval tasks.
    max_workers: 4

  followup:
    # Number of latest/newer conversation turns sent to the follow-up decision prompt.
    # Use -1 to include all available context.
    context_window_turns: 50

reply_tags:
  emo:
    - angry
    - sad
    - 😧
    - 开心
  act:
    - sad
    - 开心

audio:
  stt:
    provider: volcengine
    url: wss://openspeech.bytedance.com/api/v3/sauc/bigmodel
    app_id_env: VOLCENGINE_APP_ID
    access_key_env: VOLCENGINE_ACCESS_KEY
    resource_id_env: VOLCENGINE_RESOURCE_ID
    sample_rate: 16000
    timeout_seconds: 60

  tts:
    provider: dashscope
    realtime_url: wss://dashscope.aliyuncs.com/api-ws/v1/realtime
    api_key_env: DASHSCOPE_API_KEY
    model: qwen3-tts-flash-realtime
    voice: Cherry
    sample_rate: 24000
    timeout_seconds: 60

debug:
  print_prompts: true
