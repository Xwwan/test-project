<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Onboarding Test</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fa;
      --panel: #ffffff;
      --text: #20242a;
      --muted: #667085;
      --line: #d9dee7;
      --accent: #256f61;
      --accent-strong: #1d5a4e;
      --warn: #9a5b13;
      --done: #2b6c3f;
      --user: #e9f3ef;
      --assistant: #eef1f6;
      --shadow: 0 10px 30px rgba(24, 36, 56, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(320px, 420px) minmax(0, 1fr);
      gap: 16px;
      min-height: 100vh;
      padding: 16px;
    }

    .sidebar,
    .main {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      min-width: 0;
    }

    .sidebar {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .main {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }

    h1,
    h2 {
      margin: 0;
      font-weight: 700;
      line-height: 1.2;
    }

    h1 { font-size: 18px; }

    h2 {
      font-size: 14px;
      color: var(--muted);
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--text);
      background: #fff;
      font: inherit;
      letter-spacing: 0;
      outline: none;
    }

    input {
      min-height: 38px;
      padding: 8px 10px;
    }

    textarea {
      min-height: 82px;
      max-height: 180px;
      padding: 10px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 111, 97, 0.12);
    }

    button {
      border: 1px solid transparent;
      border-radius: 6px;
      min-height: 38px;
      padding: 8px 12px;
      color: #fff;
      background: var(--accent);
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover { background: var(--accent-strong); }

    button.secondary {
      color: var(--text);
      background: #fff;
      border-color: var(--line);
    }

    button.secondary:hover { background: #f1f4f8; }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .check-row input {
      width: 16px;
      height: 16px;
      min-height: 16px;
      padding: 0;
    }

    .status {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      min-height: 64px;
      background: #fbfcfd;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }

    .metric strong {
      display: block;
      margin-top: 5px;
      font-size: 15px;
      overflow-wrap: anywhere;
    }

    .stage {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      padding-top: 2px;
    }

    .stage-dot {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 1px solid var(--line);
      color: var(--muted);
      background: #fff;
      font-size: 12px;
      font-weight: 700;
    }

    .stage-dot.active {
      color: #fff;
      border-color: var(--accent);
      background: var(--accent);
    }

    .stage-dot.done {
      color: var(--done);
      border-color: rgba(43, 108, 63, 0.35);
      background: #edf7ef;
    }

    .transcript {
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #fafbfc;
    }

    .empty {
      margin: auto;
      max-width: 360px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .bubble {
      max-width: min(680px, 82%);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      line-height: 1.55;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .bubble.user {
      align-self: flex-end;
      background: var(--user);
      border-color: #cfe5dc;
    }

    .bubble.assistant {
      align-self: flex-start;
      background: var(--assistant);
    }

    .composer {
      padding: 12px 16px;
      border-top: 1px solid var(--line);
      background: #fff;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 10px;
      align-items: end;
    }

    .recording,
    .recording:hover {
      color: #fff;
      background: #9f2f2f;
      border-color: #9f2f2f;
    }

    .json-view {
      min-height: 180px;
      max-height: 280px;
      overflow: auto;
      margin: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      background: #111827;
      color: #dbe4ef;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .notice {
      min-height: 22px;
      color: var(--warn);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    @media (max-width: 820px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(560px, 1fr);
      }

      .composer { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div>
        <h1>Onboarding Test</h1>
        <h2>独立引导流程</h2>
      </div>

      <label>
        API Base
        <input id="apiBase" value="">
      </label>

      <label>
        Conversation ID
        <input id="conversationId" value="onboarding-test">
      </label>

      <label class="check-row">
        <input id="ttsEnabled" type="checkbox" checked>
        播放 TTS
      </label>

      <div class="actions">
        <button id="startBtn">Start</button>
        <button id="statusBtn" class="secondary">Status</button>
      </div>

      <div class="status">
        <div class="metric">
          <span>Session</span>
          <strong id="sessionId">-</strong>
        </div>
        <div class="metric">
          <span>Status</span>
          <strong id="sessionStatus">idle</strong>
        </div>
        <div class="metric">
          <span>Stage</span>
          <strong id="stageName">-</strong>
        </div>
        <div class="metric">
          <span>Final</span>
          <strong id="finalState">-</strong>
        </div>
      </div>

      <div class="stage" id="stageDots"></div>

      <pre id="collected" class="json-view">{}</pre>
      <div id="notice" class="notice"></div>
    </aside>

    <main class="main">
      <div class="topbar">
        <h1>Transcript</h1>
        <button id="clearBtn" class="secondary">Clear</button>
      </div>

      <section id="transcript" class="transcript">
        <div class="empty">Start 后开始测试五阶段引导。</div>
      </section>

      <form id="composer" class="composer">
        <textarea id="message" placeholder="输入用户回答"></textarea>
        <button id="voiceBtn" type="button" class="secondary">Record</button>
        <button id="sendBtn" type="submit">Send</button>
      </form>
    </main>
  </div>

  <script>
    const apiBaseInput = document.getElementById("apiBase");
    const conversationInput = document.getElementById("conversationId");
    const ttsEnabledInput = document.getElementById("ttsEnabled");
    const sessionIdEl = document.getElementById("sessionId");
    const statusEl = document.getElementById("sessionStatus");
    const stageNameEl = document.getElementById("stageName");
    const finalStateEl = document.getElementById("finalState");
    const stageDotsEl = document.getElementById("stageDots");
    const collectedEl = document.getElementById("collected");
    const noticeEl = document.getElementById("notice");
    const transcriptEl = document.getElementById("transcript");
    const messageEl = document.getElementById("message");
    const startBtn = document.getElementById("startBtn");
    const statusBtn = document.getElementById("statusBtn");
    const sendBtn = document.getElementById("sendBtn");
    const clearBtn = document.getElementById("clearBtn");
    const voiceBtn = document.getElementById("voiceBtn");
    const composer = document.getElementById("composer");

    let sessionId = "";
    let completed = false;
    let recording = false;
    let liveVoiceSessionId = "";
    let mediaStream = null;
    let audioContext = null;
    let sourceNode = null;
    let processorNode = null;
    let voiceChunkChain = Promise.resolve();
    let playbackContext = null;
    const targetSampleRate = 16000;

    renderDots(0, false);
    setBusy(false);

    startBtn.addEventListener("click", async () => {
      await run(async () => {
        resetTranscript();
        const payload = await postJson("/onboarding/start", {
          conversation_id: conversationInput.value.trim()
        });
        applyResponse(payload);
        addBubble("assistant", payload.reply);
        await speakAssistantReply(payload.reply);
      });
    });

    statusBtn.addEventListener("click", async () => {
      if (!sessionId) {
        showNotice("No active session.");
        return;
      }
      await run(async () => {
        const payload = await getJson(`/onboarding/status?session_id=${encodeURIComponent(sessionId)}`);
        applyResponse(payload);
      });
    });

    composer.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = messageEl.value.trim();
      if (!sessionId) {
        showNotice("Start a session first.");
        return;
      }
      if (!message) {
        return;
      }
      await run(async () => {
        messageEl.value = "";
        await sendOnboardingMessage(message);
      });
    });

    voiceBtn.addEventListener("click", async () => {
      if (!sessionId) {
        showNotice("Start a session first.");
        return;
      }
      if (completed) {
        return;
      }
      if (recording) {
        await stopVoiceRecording();
        return;
      }
      await startVoiceRecording();
    });

    clearBtn.addEventListener("click", () => {
      resetTranscript();
      showNotice("");
    });

    function baseUrl() {
      return apiBaseInput.value.trim().replace(/\/$/, "");
    }

    async function postJson(path, body) {
      const response = await fetch(`${baseUrl()}${path}`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(body)
      });
      return readJsonResponse(response);
    }

    async function getJson(path) {
      const response = await fetch(`${baseUrl()}${path}`);
      return readJsonResponse(response);
    }

    async function sendOnboardingMessage(message) {
      addBubble("user", message);
      const payload = await postJson("/onboarding/message", {
        session_id: sessionId,
        message
      });
      applyResponse(payload);
      if (payload.reply) {
        addBubble("assistant", payload.reply);
        await speakAssistantReply(payload.reply);
      }
    }

    async function startVoiceRecording() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showNotice("This browser does not support microphone capture.");
        return;
      }

      setBusy(true);
      showNotice("");
      try {
        const started = await postJson("/voice/live/start", {
          sample_rate: targetSampleRate,
          channels: 1,
          audio_format: "pcm"
        });
        liveVoiceSessionId = started.session_id;

        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            channelCount: 1,
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        });
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioContext = new AudioContextClass();
        sourceNode = audioContext.createMediaStreamSource(mediaStream);
        processorNode = audioContext.createScriptProcessor(4096, 1, 1);
        processorNode.onaudioprocess = (event) => {
          if (!recording || !liveVoiceSessionId) {
            return;
          }
          const input = event.inputBuffer.getChannelData(0);
          const samples = resampleToTarget(input, audioContext.sampleRate, targetSampleRate);
          const pcm = floatToPcm16(samples);
          queueVoiceChunk(pcm);
        };
        sourceNode.connect(processorNode);
        processorNode.connect(audioContext.destination);

        recording = true;
        voiceBtn.textContent = "Stop";
        voiceBtn.classList.add("recording");
        showNotice("Recording. Press Stop to finish.");
      } catch (error) {
        await abortVoiceSession();
        cleanupVoiceCapture();
        showNotice(error.message || String(error));
      } finally {
        setBusy(false);
      }
    }

    async function stopVoiceRecording() {
      const finishedSessionId = liveVoiceSessionId;
      recording = false;
      voiceBtn.textContent = "Record";
      voiceBtn.classList.remove("recording");
      cleanupVoiceCapture();

      await run(async () => {
        showNotice("Processing voice...");
        await voiceChunkChain;
        if (!finishedSessionId) {
          showNotice("");
          return;
        }
        const result = await postJson("/voice/live/finish-transcript", {
          session_id: finishedSessionId
        });
        liveVoiceSessionId = "";
        if (result.error) {
          throw new Error(result.error);
        }
        const transcript = (result.transcript || "").trim();
        if (!transcript) {
          showNotice("No speech transcript returned.");
          return;
        }
        messageEl.value = transcript;
        await sendOnboardingMessage(transcript);
        showNotice("");
      });
    }

    async function abortVoiceSession() {
      if (!liveVoiceSessionId) {
        return;
      }
      try {
        await postJson("/voice/live/abort", {session_id: liveVoiceSessionId});
      } catch (error) {
        return;
      } finally {
        liveVoiceSessionId = "";
      }
    }

    function cleanupVoiceCapture() {
      if (processorNode) {
        processorNode.disconnect();
        processorNode.onaudioprocess = null;
        processorNode = null;
      }
      if (sourceNode) {
        sourceNode.disconnect();
        sourceNode = null;
      }
      if (mediaStream) {
        mediaStream.getTracks().forEach((track) => track.stop());
        mediaStream = null;
      }
      if (audioContext) {
        audioContext.close();
        audioContext = null;
      }
    }

    function queueVoiceChunk(arrayBuffer) {
      if (!liveVoiceSessionId || !arrayBuffer.byteLength) {
        return;
      }
      const activeSessionId = liveVoiceSessionId;
      voiceChunkChain = voiceChunkChain
        .then(() => postJson("/voice/live/chunk", {
          session_id: activeSessionId,
          audio_base64: arrayBufferToBase64(arrayBuffer)
        }))
        .catch((error) => {
          showNotice(error.message || String(error));
        });
    }

    function resampleToTarget(input, inputRate, outputRate) {
      if (inputRate === outputRate) {
        return new Float32Array(input);
      }
      const ratio = inputRate / outputRate;
      const outputLength = Math.max(1, Math.round(input.length / ratio));
      const output = new Float32Array(outputLength);
      for (let index = 0; index < outputLength; index += 1) {
        const position = index * ratio;
        const left = Math.floor(position);
        const right = Math.min(left + 1, input.length - 1);
        const weight = position - left;
        output[index] = input[left] * (1 - weight) + input[right] * weight;
      }
      return output;
    }

    function floatToPcm16(samples) {
      const buffer = new ArrayBuffer(samples.length * 2);
      const view = new DataView(buffer);
      for (let index = 0; index < samples.length; index += 1) {
        const sample = Math.max(-1, Math.min(1, samples[index]));
        view.setInt16(
          index * 2,
          sample < 0 ? sample * 0x8000 : sample * 0x7fff,
          true
        );
      }
      return buffer;
    }

    function arrayBufferToBase64(buffer) {
      const bytes = new Uint8Array(buffer);
      let binary = "";
      const chunkSize = 0x8000;
      for (let offset = 0; offset < bytes.length; offset += chunkSize) {
        const chunk = bytes.subarray(offset, offset + chunkSize);
        binary += String.fromCharCode.apply(null, chunk);
      }
      return btoa(binary);
    }

    async function speakAssistantReply(text) {
      if (!ttsEnabledInput.checked || !text.trim()) {
        return;
      }
      showNotice("Playing TTS...");
      const response = await fetch(`${baseUrl()}/voice/tts/stream`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({text})
      });
      if (!response.ok) {
        await readJsonResponse(response);
        return;
      }
      const sampleRate = Number(response.headers.get("X-Sample-Rate") || "24000");
      if (!response.body) {
        showNotice("");
        return;
      }
      await playPcm16Stream(response.body, sampleRate);
      showNotice("");
    }

    async function playPcm16Stream(stream, sampleRate) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      playbackContext = playbackContext || new AudioContextClass();
      const reader = stream.getReader();
      let nextStartTime = Math.max(playbackContext.currentTime + 0.04, playbackContext.currentTime);
      let pending = new Uint8Array(0);

      while (true) {
        const {value, done} = await reader.read();
        if (done) {
          break;
        }
        if (!value || !value.byteLength) {
          continue;
        }
        const bytes = concatBytes(pending, value);
        const evenLength = bytes.byteLength - (bytes.byteLength % 2);
        if (!evenLength) {
          pending = bytes;
          continue;
        }
        const playable = bytes.slice(0, evenLength);
        pending = bytes.slice(evenLength);
        nextStartTime = schedulePcm16(playable, sampleRate, nextStartTime);
      }

      if (pending.byteLength >= 2) {
        nextStartTime = schedulePcm16(
          pending.slice(0, pending.byteLength - (pending.byteLength % 2)),
          sampleRate,
          nextStartTime
        );
      }
      const delayMs = Math.max(0, (nextStartTime - playbackContext.currentTime) * 1000);
      if (delayMs > 0) {
        await new Promise((resolve) => setTimeout(resolve, delayMs));
      }
    }

    function concatBytes(left, right) {
      if (!left.byteLength) {
        return right;
      }
      const merged = new Uint8Array(left.byteLength + right.byteLength);
      merged.set(left, 0);
      merged.set(right, left.byteLength);
      return merged;
    }

    function schedulePcm16(bytes, sampleRate, startTime) {
      const frameCount = Math.floor(bytes.length / 2);
      const audioBuffer = playbackContext.createBuffer(1, frameCount, sampleRate);
      const channel = audioBuffer.getChannelData(0);
      const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
      for (let index = 0; index < frameCount; index += 1) {
        channel[index] = view.getInt16(index * 2, true) / 0x8000;
      }
      const source = playbackContext.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(playbackContext.destination);
      const scheduledAt = Math.max(startTime, playbackContext.currentTime + 0.01);
      source.start(scheduledAt);
      return scheduledAt + audioBuffer.duration;
    }

    async function readJsonResponse(response) {
      const payload = await response.json();
      if (!response.ok) {
        const message = payload && payload.error && payload.error.message
          ? payload.error.message
          : `HTTP ${response.status}`;
        throw new Error(message);
      }
      return payload;
    }

    async function run(task) {
      setBusy(true);
      showNotice("");
      try {
        await task();
      } catch (error) {
        showNotice(error.message || String(error));
      } finally {
        setBusy(false);
      }
    }

    function applyResponse(payload) {
      sessionId = payload.session_id || sessionId;
      completed = Boolean(payload.onboarding_complete);
      sessionIdEl.textContent = sessionId || "-";
      statusEl.textContent = payload.status || "idle";
      stageNameEl.textContent = payload.stage_name
        ? `${payload.stage}. ${payload.stage_name}`
        : "-";
      finalStateEl.textContent = payload.final_payload
        ? "ready"
        : completed
          ? "missing"
          : "-";
      collectedEl.textContent = JSON.stringify(
        payload.final_payload || payload.collected || {},
        null,
        2
      );
      renderDots(Number(payload.stage || 0), completed);
      messageEl.disabled = completed;
      sendBtn.disabled = completed;
    }

    function renderDots(activeStage, isComplete) {
      stageDotsEl.innerHTML = "";
      for (let index = 1; index <= 5; index += 1) {
        const dot = document.createElement("div");
        dot.className = "stage-dot";
        if (isComplete || index < activeStage) {
          dot.classList.add("done");
        } else if (index === activeStage) {
          dot.classList.add("active");
        }
        dot.textContent = String(index);
        stageDotsEl.appendChild(dot);
      }
    }

    function addBubble(role, text) {
      const empty = transcriptEl.querySelector(".empty");
      if (empty) {
        empty.remove();
      }
      const node = document.createElement("div");
      node.className = `bubble ${role}`;
      node.textContent = text;
      transcriptEl.appendChild(node);
      transcriptEl.scrollTop = transcriptEl.scrollHeight;
    }

    function resetTranscript() {
      transcriptEl.innerHTML = '<div class="empty">Start 后开始测试五阶段引导。</div>';
    }

    function showNotice(text) {
      noticeEl.textContent = text || "";
    }

    function setBusy(isBusy) {
      startBtn.disabled = isBusy;
      statusBtn.disabled = isBusy;
      sendBtn.disabled = isBusy || completed;
      voiceBtn.disabled = (isBusy && !recording) || completed;
    }
  </script>
</body>
</html>
